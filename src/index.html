<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="sasha-jovic" />
    <meta name="description" content="website" />
    <meta name="keywords" content="se_project_spots" />
    <title>Spots</title>
  </head>
  <body>
    <header class="header">
      <img
        src="<%=require('./images/spots-logo.svg')%>"
        alt="spot logo"
        class="header__logo"
      />
    </header>
    <div class="page">
      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <img
              src="<%=require('./images/avatar.webp')%>"
              alt="bessie"
              class="profile__avatar"
            />
            <button class="profile__avatar-btn">
              <img
                src="<%=require('./images/pencil-white.svg')%>"
                alt="profile__pencil-icon"
                class="profile__pencil-icon"
              />
            </button>
          </div>

          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <div class="profile__edit-container">
              <button type="button" class="profile__edit-button">
                <img
                  src="<%=require('./images/pencil.svg')%>"
                  alt="pencil-icon"
                  class="profile__pencil-icon"
                />

                Edit Profile
              </button>
            </div>
          </div>

          <button type="button" class="profile__new-post-button">
            <img
              src="<%=require('./images/Group-26.svg')%>"
              alt="plus"
              class="profile__plus"
            />
            <span class="profile__button-text">New Post</span>
          </button>
        </section>
        <div class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <img src="#" alt="" class="card__image" />
                <div class="card__footer">
                  <h2 class="card__title">#</h2>

                  <button class="card__delete-button" type="button">
                    <img src="#" alt="" />
                  </button>
                  <button
                    type="button"
                    id="cardLikeButtonLiked"
                    class="card__like-button card__like-button_isLiked"
                  ></button>
                </div>
              </li>
            </template>
          </ul>
        </div>
      </main>
      <footer class="footer">
        <p class="footer__copyright">2023©Spots</p>
      </footer>

      <div class="modal" id="edit-modal">
        <div class="modal__content">
          <button type="submit" class="modal__close"></button>
          <h2 class="modal__title">Edit profile</h2>
          <form
            name="profile-form"
            id="profile-form"
            class="modal__form"
            novalidate
          >
            <label for="profile-name-input" class="modal__label">
              Name
              <input
                id="profile-name-input"
                type="text"
                class="modal__input modal__input_type_error"
                name="name"
                placeholder="Type your name"
                autocomplete="on"
                minlength="2"
                maxlength="40"
                required
              />
              <span id="profile-name-input-error" class="modal__error"></span>
            </label>
            <label for="profile-description-input" class="modal__label">
              Description
              <input
                id="profile-description-input"
                type="text"
                class="modal__input modal__input_type_error"
                name="description"
                placeholder="Describe yourself"
                autocomplete="on"
                minlength="2"
                maxlength="200"
                required
              />
              <span
                id="profile-description-input-error"
                class="modal__error"
              ></span>
            </label>
            <button
              type="submit"
              class="modal__submit-button modal__submit-button_disabled"
            >
              Save
            </button>
          </form>
        </div>
      </div>

      <div class="modal" id="add-card-modal">
        <div class="modal__content">
          <button
            aria-label="Close-modal"
            type="button"
            class="modal__close"
          ></button>
          <p class="modal__title">New post</p>

          <form class="modal__form" id="add-card-Modal" novalidate>
            <label class="modal__label" for="add-card-link-input">
              Image link
              <input
                id="add-card-link-input"
                type="url"
                class="modal__input modal__input_type_error"
                name="link"
                placeholder="Paste a link to the picture"
                required
              />
              <span id="add-card-link-input-error" class="modal__error"></span>
            </label>

            <label for="add-card-name-input" class="modal__label">
              Caption
              <input
                id="add-card-name-input"
                type="text"
                class="modal__input modal__input_type_error"
                name="name"
                placeholder="Type your caption"
                autocomplete="on"
                minlength="2"
                maxlength="30"
                required
              />
              <span id="add-card-name-input-error" class="modal__error"></span>
            </label>
            <button
              type="submit"
              class="modal__submit-button modal__submit-button_disabled"
            >
              Save
            </button>
          </form>
        </div>
      </div>
    </div>
    <div class="modal" id="preview-modal">
      <div class="modal__content modal__content_type_preview">
        <button
          aria-label="Close modal"
          class="modal__close modal__close_type_preview"
          id="add-modal-close"
          type="button"
        ></button>
        <img
          class="modal__image modal__image_type_preview"
          src="#"
          alt=""
          id="add-modal-image"
        />
        <p
          class="modal__caption modal__caption_type_preview"
          id="add-modal-caption"
        ></p>
      </div>
    </div>

    <div class="modal" id="avatar-modal">
      <div class="modal__content">
        <button
          aria-label="Close-modal"
          type="button"
          class="modal__close"
        ></button>
        <p class="modal__title">Edit avatar</p>

        <form class="modal__form" id="edit-avatar-form" novalidate>
          <label class="modal__label" for="profile-avatar-input">
            Avatar
            <input
              id="profile-avatar-input"
              type="url"
              class="modal__input modal__input_type_error"
              name="avatar"
              placeholder="Avatar goes here"
              required
            />
            <span id="profile-avatar-input-error" class="modal__error"></span>
          </label>
          <button
            type="submit"
            class="modal__submit-button modal__submit-button_disabled"
          >
            Save
          </button>
        </form>
      </div>
    </div>

    <div class="modal" id="delete-modal">
      <div class="modal__content modal__content-delete">
        <button
          aria-label="Close-modal"
          type="button"
          class="modal__close"
        ></button>
        <h3 class="modal__title modal__title-delete">
          Are you sure you want to delete this image?
        </h3>

        <form class="modal__form" id="delete-form">
          <div class="modal__delete-content">
            <button
              type="submit"
              class="modal__submit-button modal__submit-button_delete"
            >
              Delete
            </button>

            <button type="button" class="modal__button modal__button_text">
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
